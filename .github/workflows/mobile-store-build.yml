name: Build Nmood store releases

on:
  workflow_dispatch:

jobs:
  android-store-bundle:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_PATH: release.jks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Android upload key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Build Nmood
        run: |
          npm install
          npm run build:supabase
          npx cap sync android

      - name: Build signed Android App Bundle
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease

      - name: Save signed Android App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: nmood-google-play-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
