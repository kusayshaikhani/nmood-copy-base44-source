name: Deploy Nmood to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Bind the configured production project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          ref="${VITE_SUPABASE_URL#https://}"
          ref="${ref%%.supabase.co*}"
          test -n "$ref" && test "$ref" != "$VITE_SUPABASE_URL"
          echo "VITE_SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"
          echo "VITE_PRODUCTION_SUPABASE_PROJECT_REF=$ref" >> "$GITHUB_ENV"

      - name: Build Nmood
        run: npm run build:supabase
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_TARGET: production
          VITE_ALLOW_PRODUCTION_SUPABASE: "true"

      - name: Deploy Nmood to Cloudflare
        run: npx wrangler@4 deploy --name nmood-copy-base44-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
