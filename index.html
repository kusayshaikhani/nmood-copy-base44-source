    <div id="nmood-loading" role="status" style="padding:48px 24px;text-align:center;font:18px system-ui;color:#24105f">Loading Nmood…</div>

      <p id="nmood-recovery-reference"></p>
      <button id="nmood-retry" style="min-height:48px;padding:12px 24px;margin:8px">Try again</button>
      <button id="nmood-signout" style="min-height:48px;padding:12px 24px;margin:8px">Sign out</button>
    </section>
    <div id="root"></div>
    <script src="/bootstrap-recovery.js"></script>
